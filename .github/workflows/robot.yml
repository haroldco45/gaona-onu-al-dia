name: Robot de noticias (cada 30 min)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Traer noticias reales
        run: node robot/actualizar.mjs
      - name: Guardar cambios
        run: |
          git config user.name "robot-vibras"
          git config user.email "robot@vibraspositivashm.com"
          git add noticias.json
          git diff --cached --quiet || (git commit -m "Robot: noticias $(TZ=America/Bogota date '+%Y-%m-%d %H:%M') hora Colombia" && git push)
